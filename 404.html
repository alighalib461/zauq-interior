<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Ba Zauq Interiors</title>
  <meta name="description" content="The page you are looking for does not exist. Return to Ba Zauq Interiors luxury portfolio.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 20%, #171f2c 0%, #0a0d13 100%);
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      text-align: center;
      padding: 24px;
      overflow: hidden;
      position: relative;
    }
    body::before {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.08) 0%, rgba(212, 175, 55, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .error-card {
      background: rgba(20, 27, 38, 0.85);
      border: 1px solid rgba(212, 175, 55, 0.3);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 48px 36px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.6), 0 0 30px rgba(212, 175, 55, 0.1);
      position: relative;
      z-index: 1;
    }
    .badge {
      display: inline-block;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: #d4af37;
      background: rgba(212, 175, 55, 0.12);
      border: 1px solid rgba(212, 175, 55, 0.35);
      padding: 6px 18px;
      border-radius: 999px;
      margin-bottom: 24px;
    }
    h1 {
      font-family: 'Cinzel', serif;
      font-size: 64px;
      margin: 0 0 8px 0;
      background: linear-gradient(135deg, #fff2b2 0%, #d4af37 50%, #aa820a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
      letter-spacing: 2px;
    }
    h2 {
      font-size: 20px;
      color: #f1f5f9;
      margin-bottom: 14px;
      font-weight: 600;
    }
    p {
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.6;
      margin: 0 0 32px 0;
    }
    .btn-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(135deg, #d4af37 0%, #aa820a 100%);
      color: #0b0f14;
      padding: 14px 32px;
      border-radius: 10px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.3s ease;
      font-size: 15px;
      box-shadow: 0 8px 20px rgba(212, 175, 55, 0.3);
    }
    .btn-home:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(212, 175, 55, 0.45);
      background: linear-gradient(135deg, #e5c158 0%, #bf9412 100%);
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="badge">Ba Zauq Interiors</div>
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The architectural view or section you requested is unavailable or has moved.</p>
    <a href="/" class="btn-home">
      <span>Return to Homepage</span>
      <span>&rarr;</span>
    </a>
  </div>
</body>
</html>
